[project]
name = "jembatan112"
version = "0.1.0"
description = "Jembatan 112 - Relay Darurat untuk Warga Tuli"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "asyncpg>=0.29.0",
    "anthropic>=0.34.0",
    "google-cloud-texttospeech>=2.17.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "pywebpush>=2.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
eval = [
    "jiwer>=3.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
