name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only -a jembatan-112-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Skip notice if secret missing
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::Secret FLY_API_TOKEN belum diatur di repository. Backend deploy dilewati."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js 22
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/web
        run: npx --yes vercel@53 --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="team_f3VKLewxSLoovEO7y50OprvQ" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_f3VKLewxSLoovEO7y50OprvQ' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_PCY7d0kdyE9Dng2MZEbKPG3UdrwC' }}

      - name: Skip notice if secret missing
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::notice::Secret VERCEL_TOKEN tidak diatur. Jika menggunakan Vercel Git Integration, deployment otomatis ditangani langsung oleh Vercel."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
