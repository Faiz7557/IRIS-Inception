# fly.toml app configuration for Jembatan 112 API
# Primary region sin (Singapore) for low-latency emergency audio & WebSocket streaming to Indonesia.
# Single machine instance (min_machines_running = 1) is strictly required to preserve in-memory CallSession state.

app = "jembatan-112-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  J112_ENV = "prod"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
